<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Loop mark: a single open ring — the route, and the shape the name
       says out loud. Kept to one stroke, no secondary marks: identity on
       the map itself is read by name now, not by a dot or a colour, and
       the logo follows the same restraint. -->
  <path
    d="M 66 22.29 A 32 32 0 1 1 34 22.29"
    stroke="#2F80FF"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />
</svg>
